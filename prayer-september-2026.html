<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Hope Club — A Prayer for You</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'><rect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='13'%20fill='%23120F0D'/><rect%20x='15'%20y='22'%20width='34'%20height='21'%20rx='2'%20fill='none'%20stroke='%23F4EFE2'%20stroke-width='2.6'/><path%20d='M15%2022L32%2034L49%2022'%20fill='none'%20stroke='%23F4EFE2'%20stroke-width='2.6'%20stroke-linecap='round'%20stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E8;--card:#FFFFFF;--ink:#1A1613;--soft:#4A423A;--muted:#8A8072;--line:#E7E0D2;
    --serif:"Playfair Display","Palatino Linotype","Book Antiqua",Georgia,serif;
    --mono:"American Typewriter","Courier Prime",ui-monospace,"Courier New",Courier,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--serif);
    display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .card{width:100%;max-width:430px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 30px 70px -30px rgba(26,22,19,.22);padding:2.5rem 2rem 2.2rem;text-align:center}
  .logo{width:66%;max-width:250px;aspect-ratio:1219/369;margin:0 auto 1.7rem;background:url('prayer-logo.png') center/contain no-repeat}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:0 0 1rem}
  h1{font-family:var(--serif);font-weight:600;font-size:2.3rem;line-height:1.1;margin:0 0 1.2rem;color:var(--ink)}
  .sub{font-family:var(--serif);font-size:1.08rem;color:var(--soft);margin:0 0 1.9rem}
  .player{display:flex;align-items:center;gap:1rem;border:1px solid var(--line);border-radius:999px;padding:.65rem .8rem;background:var(--paper)}
  .play-btn{flex:0 0 auto;width:60px;height:60px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:1.1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1;transition:transform .15s}
  .play-btn:hover{transform:scale(1.05)}
  .play-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .p-right{flex:1;min-width:0;text-align:left;padding-right:.7rem}
  .progress{height:4px;background:var(--line);border-radius:3px;position:relative;cursor:pointer;overflow:hidden}
  .progress .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);border-radius:3px}
  .times{display:flex;justify-content:space-between;margin-top:.55rem;font-family:var(--mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .foot{font-family:var(--mono);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:1.9rem 0 0}
  .expired{font-family:var(--serif);color:var(--soft);line-height:1.7;font-size:1.02rem;padding:.4rem 0 .2rem}
</style>

<div class="card">
  <div class="logo" role="img" aria-label="The Hope Club"></div>
  <p class="eyebrow">September 2026</p>
  <h1>A Prayer for You</h1>

  <div id="live">
    <p class="sub">Press play to hear your prayer.</p>
    <div class="player">
      <button class="play-btn" id="playBtn" type="button" aria-label="Play">&#9654;</button>
      <div class="p-right">
        <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
        <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      </div>
    </div>
    <p class="foot">This prayer is available for 30 days.</p>
  </div>

  <div id="expired" class="expired" hidden>
    This month&rsquo;s prayer has gently come to a close. &#128331;<br>A new one arrives with next month&rsquo;s letter.
  </div>

  <audio id="audio" preload="metadata"><source src="prayer-september-2026.m4a" type="audio/mp4"></audio>
</div>

<script>
  (function(){
    var EXPIRES = new Date("2026-09-30T23:59:59");
    var live = document.getElementById('live');
    var expired = document.getElementById('expired');
    if(new Date() > EXPIRES){ live.hidden = true; expired.hidden = false; return; }

    var audio = document.getElementById('audio');
    var playBtn = document.getElementById('playBtn');
    var bar = document.getElementById('bar');
    var progress = document.getElementById('progress');
    var cur = document.getElementById('cur');
    var dur = document.getElementById('dur');

    function fmt(s){ s = Math.floor(s || 0); var m = Math.floor(s/60); var ss = s % 60; return m + ':' + (ss < 10 ? '0' : '') + ss; }

    playBtn.addEventListener('click', function(){ if(audio.paused){ audio.play(); } else { audio.pause(); } });
    audio.addEventListener('play', function(){ playBtn.innerHTML = '&#10073;&#10073;'; playBtn.setAttribute('aria-label','Pause'); });
    audio.addEventListener('pause', function(){ playBtn.innerHTML = '&#9654;'; playBtn.setAttribute('aria-label','Play'); });
    audio.addEventListener('ended', function(){ playBtn.innerHTML = '&#9654;'; });
    audio.addEventListener('loadedmetadata', function(){ dur.textContent = fmt(audio.duration); });
    audio.addEventListener('timeupdate', function(){
      if(audio.duration){ bar.style.width = (audio.currentTime / audio.duration * 100) + '%'; }
      cur.textContent = fmt(audio.currentTime);
    });
    progress.addEventListener('click', function(e){
      var r = progress.getBoundingClientRect();
      var pct = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      if(audio.duration){ audio.currentTime = pct * audio.duration; }
    });
  })();
</script>
